name: plantao_ret
description: Sistema de Plantões RET
publish_to: "none"

# Atualize esta versão a cada nova publicação
version: 2.0.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Controle da janela Windows
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geração automática dos ícones
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/icon/app_icon.png

  # Android Adaptive Icon
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_background: "#07152B"

  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700